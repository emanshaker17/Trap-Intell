        <svg

            fill="#3D42DF"
          />
        </svg>
        <h3>Trap-intell</h3>
      </div>
    </header>

    <main>
      <div class="page">
        <!-- right: Form -->
        <div class="left-panel">
          <div class="form-card">
            <div class="form-header">
              <h1 class="form-title">Create Organization</h1>
              <p class="form-subtitle">
                Get started with enterprise-grade security monitoring.
              </p>
            </div>

            <div class="form-grid">
              <!-- Organization Name -->
              <div class="form-group full">
                <div class="field-wrap">
                  <input type="text" id="orgName" placeholder="john.doe" />
                  <label for="orgName">Organization Name</label>
                </div>
              </div>

              <!-- Industry + Company Size -->
              <div class="form-group">
                <div class="field-wrap select-wrap">
                  <select id="industry">
                    <option value="" disabled selected>Select an Option</option>
                    <option>Technology</option>
                    <option>Finance</option>
                    <option>Healthcare</option>
                    <option>Education</option>
                    <option>Retail</option>
                    <option>Government</option>
                    <option>Other</option>
                  </select>
                  <label for="industry">Industry</label>
                  <svg
                    class="select-arrow"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#727c9a"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="6 9 12 15 18 9" />
                  </svg>
                </div>
              </div>

              <div class="form-group">
                <div class="field-wrap select-wrap">
                  <select id="companySize">
                    <option value="" disabled selected>Select an Option</option>
                    <option>1–10</option>
                    <option>11–50</option>
                    <option>51–200</option>
                    <option>201–500</option>
                    <option>500+</option>
                  </select>
                  <label for="companySize">Company Size</label>
                  <svg
                    class="select-arrow"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#727c9a"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="6 9 12 15 18 9" />
                  </svg>
                </div>
              </div>

              <!-- Website -->
              <div class="form-group full">
                <div class="field-wrap pw-wrap">
                  <input type="url" id="website" placeholder="https://" />
                  <label for="website">Website</label>
                  <svg
                    class="field-icon"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#727c9a"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <line x1="2" y1="12" x2="22" y2="12" />
                    <path
                      d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
                    />
                  </svg>
                </div>
              </div>

              <!-- Terms -->
              <div class="form-group full">
                <label class="checkbox-row">
                  <input type="checkbox" id="terms" />
                  <span class="checkbox-label">
                    I agree to all the <a href="#">Terms</a> and
                    <a href="#">Privacy Policies</a>
                  </span>
                </label>
              </div>

              <!-- Buttons -->
              <div class="form-group full btn-row">
                <button type="button" class="btn-back" onclick="history.back()">
                  Back
                </button>
                <button
                  type="button"
                  class="btn-create"
                  onclick="handleCreate()"
                >
                  Create account
                </button>
              </div>

              <!-- Login link -->
              <div class="form-group full">
                <p class="login-row">
                  Already have an account? <a href="login.html">Login</a>
                </p>
              </div>

              <!-- Divider -->
              <div class="form-group full">
                <div class="divider">Or Sign up with</div>
              </div>

              <!-- Social -->
              <div class="form-group full social-row">
                <button class="btn-social" type="button">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                      fill="#1877F2"
                    />
                  </svg>
                </button>
                <button class="btn-social" type="button">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                      fill="#4285F4"
                    />
                    <path
                      d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                      fill="#34A853"
                    />
                    <path
                      d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                      fill="#FBBC05"
                    />
                    <path
                      d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                      fill="#EA4335"
                    />
                  </svg>
                </button>
                <button class="btn-social" type="button">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.54 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"
                      fill="#000"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <!-- /form-grid -->
          </div>
          <!-- /form-card -->
        </div>
        <!-- /right-panel -->
        <!-- Left: Hero Image -->
        <div class="right-panel">
          <div class="hero-image-wrap">
            <img src="../Images/lock.png" alt="Cybersecurity Shield" />
          </div>
        </div>
      </div>
      <!-- /page -->
    </main>

    <script>
      function handleCreate() {
        const terms = document.getElementById("terms");
        if (!terms.checked) {
          terms.closest(".checkbox-row").style.animation = "shake 0.4s";
          setTimeout(
            () => (terms.closest(".checkbox-row").style.animation = ""),
            400,
          );
          return;
        }
        const btn = document.querySelector(".btn-create");
        btn.textContent = "Creating…";
        btn.disabled = true;
        btn.style.opacity = "0.8";
      }
    </script>

    <style>
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }
    </style>
  </body>
</html>
